<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Umów wizytę | Magdalena Żurek</title><link rel="stylesheet" href="booking.css"></head><body><main><a href="index.html">← Wróć do strony</a><p class="eyebrow">REZERWACJA ONLINE</p><h1>Umów swoją wizytę</h1><p>Wybierz usługę, datę i wolną godzinę.</p><form id="book"><label>Usługa<select id="service" required></select></label><label>Data<input id="date" type="date" required></label><div><b>Wolne godziny</b><div id="slots" class="slots">Najpierw wybierz usługę i datę.</div></div><label>Imię i nazwisko<input id="name" required></label><label>Telefon<input id="phone" type="tel" required></label><label>E-mail<input id="email" type="email" required></label><label>Uwagi (opcjonalnie)<textarea id="note"></textarea></label><button>Potwierdź rezerwację</button><p id="msg" role="status"></p></form></main><script>const $=x=>document.querySelector(x),s=$('#service'),d=$('#date'),slots=$('#slots'),fallback=[{id:'klasyczny',name:'Manicure klasyczny',minutes:60},{id:'hybryda',name:'Manicure hybrydowy',minutes:90},{id:'spa-mani',name:'Manicure SPA',minutes:75},{id:'french',name:'French manicure',minutes:105},{id:'babyboomer',name:'Baby Boomer',minutes:105},{id:'zel',name:'Przedłużanie paznokci żelem',minutes:180},{id:'forma',name:'Budowa paznokci na formie',minutes:180},{id:'uzupelnienie',name:'Uzupełnienie stylizacji żelowej',minutes:150},{id:'wzmocnienie',name:'Wzmocnienie naturalnej płytki żelem',minutes:105},{id:'zmiana',name:'Zmiana stylizacji żelowej',minutes:150},{id:'naprawa',name:'Naprawa jednego paznokcia',minutes:20},{id:'pedi-klasyczny',name:'Pedicure klasyczny',minutes:75},{id:'pedicure',name:'Pedicure hybrydowy',minutes:90},{id:'pedi-spa',name:'Pedicure SPA',minutes:105},{id:'kobido',name:'Masaż Kobido',minutes:75}];let services=fallback,chosen='';function fill(list){s.innerHTML='<option value="">Wybierz usługę</option>';list.forEach(v=>s.add(new Option(`${v.name} · ${v.minutes} min`,v.id)))}fill(fallback);d.min=new Date().toISOString().slice(0,10);fetch('/api/public/settings').then(r=>r.ok?r.json():Promise.reject()).then(x=>{services=x.services;fill(services);if(!x.configured)$('#msg').textContent='Rezerwacje zostaną uruchomione po konfiguracji przez właścicielkę.'}).catch(()=>$('#msg').textContent='Usługi są dostępne. Pełny kalendarz wolnych terminów uruchamia się po publikacji strony.');async function load(){if(!s.value||!d.value)return;try{const x=await fetch(`/api/public/slots?date=${d.value}&serviceId=${s.value}`).then(r=>r.json());slots.innerHTML=x.slots.length?x.slots.map(t=>`<button type="button" data-time="${t}">${t}</button>`).join(''):'Brak wolnych terminów tego dnia.';slots.querySelectorAll('button').forEach(b=>b.onclick=()=>{chosen=b.dataset.time;slots.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')})}catch{slots.textContent='Kalendarz będzie dostępny po uruchomieniu systemu rezerwacji.'}}s.onchange=load;d.onchange=load;$('#book').onsubmit=async e=>{e.preventDefault();if(!chosen)return $('#msg').textContent='Wybierz godzinę. Pełna rezerwacja działa po uruchomieniu systemu.';try{const r=await fetch('/api/public/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({serviceId:s.value,date:d.value,time:chosen,name:$('#name').value,phone:$('#phone').value,email:$('#email').value,note:$('#note').value})}),x=await r.json();$('#msg').textContent=x.ok?'Dziękujemy. Wizyta została zapisana!':x.error}catch{$('#msg').textContent='System rezerwacji nie jest teraz uruchomiony.'}}</script></body></html>
