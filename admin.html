<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel administracyjny</title><link rel="stylesheet" href="booking.css"></head><body><main><a href="index.html">← Strona główna</a><p class="eyebrow">MAGDALENA ŻUREK BEAUTY STUDIO</p><h1>Panel rezerwacji</h1><section id="setup"><p>Przy pierwszym uruchomieniu ustaw hasło do panelu.</p><input id="setupMail" value="siikarol10@gmail.com" type="email"><input id="setupPass" placeholder="Hasło (min. 10 znaków)" type="password"><button onclick="setup()">Utwórz panel</button></section><section id="login" hidden><input id="pass" placeholder="Hasło administratora" type="password"><button onclick="login()">Zaloguj</button></section><section id="dashboard" hidden><h2>Wizyty i klientki</h2><div id="summary"></div><div id="bookings"></div><h2>Godziny pracy</h2><p>Domyślnie: pon.–pt. 09:00–18:00, sob. 10:00–14:00. Ustawienia usług i godzin można rozbudować po uruchomieniu.</p></section></main><script>const $=x=>document.querySelector(x);async function setup(){let r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#setupMail').value,password:$('#setupPass').value})});if(r.ok){$('#setup').hidden=true;$('#login').hidden=false}else alert((await r.json()).error)}async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pass').value})});if(r.ok)load();else alert('Nieprawidłowe hasło')}async function load(){let r=await fetch('/api/admin/data');if(!r.ok)return;let x=await r.json();$('#setup').hidden=true;$('#login').hidden=true;$('#dashboard').hidden=false;const active=x.bookings.filter(b=>b.status==='confirmed').length,clients=new Set(x.bookings.map(b=>b.email)).size;$('#summary').innerHTML=`<p><b>${active}</b> nadchodzących wizyt · <b>${clients}</b> klientek w bazie</p>`;$('#bookings').innerHTML=x.bookings.length?x.bookings.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(b=>`<article><b>${b.date} · ${b.time}</b><br>${b.name} · ${b.phone} · ${b.email}<br><small>${x.settings.services.find(s=>s.id===b.serviceId)?.name||''}</small><select onchange="status('${b.id}',this.value)">${['confirmed','completed','no-show','cancelled'].map(v=>`<option ${b.status===v?'selected':''}>${v}</option>`).join('')}</select></article>`).join(''):'Brak rezerwacji.'}async function status(id,status){await fetch('/api/admin/booking',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});load()}</script></body></html>
